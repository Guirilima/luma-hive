<luma-modal
  title="NOVO &lt;span class=word-tag&gt;HANDOFF&lt;/span&gt;"
  subtitle="TRANSFERÊNCIA DE ATIVIDADE / CONTEXTO EXPLICITO"
  (closed)="dialogs.close()"
>
  <form id="handoffForm" (ngSubmit)="save()">
    <div class="form-grid">
      <div class="field">
        <label for="handoffFrom">AGENTE DE ORIGEM</label>
        <select id="handoffFrom" name="from" [(ngModel)]="from">
          @for (a of store.team(); track a.id) {
            <option [value]="a.id">{{ a.name }}</option>
          }
        </select>
      </div>
      <div class="field">
        <label for="handoffTo">AGENTE DE DESTINO</label>
        <select id="handoffTo" name="to" [(ngModel)]="to">
          @for (a of store.team(); track a.id) {
            <option [value]="a.id">{{ a.name }} / {{ roleLabel(a) }}</option>
          }
        </select>
      </div>
      <div class="field full">
        <label for="handoffFeature">FEATURE / ATIVIDADE</label>
        <select id="handoffFeature" name="featureId" [(ngModel)]="featureId">
          @for (f of candidates(); track f.id) {
            <option [value]="f.id">{{ f.key }} / {{ f.title }}</option>
          }
        </select>
      </div>
      <div class="field full">
        <label for="handoffContext">CONTEXTO PARA O PRÓXIMO AGENTE</label>
        <textarea
          id="handoffContext"
          name="context"
          [(ngModel)]="context"
          maxlength="10000"
          style="min-height: 140px"
          placeholder="O que foi definido? Qual e o próximo passo? Quais sao os contratos, restrições e critérios?"
        ></textarea>
      </div>
    </div>
    <div class="notice">
      <luma-icon name="flow" />
      Este handoff substitui a rota pendente da feature por Origem &gt; Destino e preserva suas
      dependências. O registro é local; não inicia execução automaticamente.
    </div>
  </form>
  <footer class="modal-footer" modal-footer>
    <button class="btn ghost" (click)="dialogs.close()">Cancelar</button>
    <button class="btn primary" type="submit" form="handoffForm">
      <luma-icon name="arrow" />
      Registrar handoff
    </button>
  </footer>
</luma-modal>
